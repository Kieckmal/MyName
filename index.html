<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Item Image Engine v0.1</title>
<style>
:root{--bg:#0a0d12;--panel:#141a23;--line:#303b4e;--text:#eef2f7;--muted:#9aa6b5}
*{box-sizing:border-box}body{margin:0;background:#0a0d12;color:var(--text);font:14px system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:1100px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:330px 1fr;gap:16px}
.panel{background:#141a23;border:1px solid var(--line);border-radius:14px;padding:14px}h1{margin:0 0 4px;font-size:24px}.sub{color:var(--muted);margin-bottom:14px}
label{display:block;color:var(--muted);font-size:11px;margin:8px 0 4px}select,input,button{font:inherit}
select,input{width:100%;padding:8px;background:#0d1219;color:#fff;border:1px solid var(--line);border-radius:8px}
.row{display:flex;gap:8px}.row>*{flex:1}button{margin-top:10px;padding:9px;border:1px solid #4a5870;border-radius:8px;background:#2c3748;color:#fff;font-weight:700}
button.primary{background:#71531d}.preview{display:grid;grid-template-columns:minmax(300px,520px) 1fr;gap:14px}.canvasbox{background:#0d1219;border:1px solid var(--line);border-radius:14px;padding:14px}
canvas{display:block;width:100%;max-width:512px;aspect-ratio:1;image-rendering:pixelated;background:#0b0f15;border-radius:8px}
.meta{background:#181f2b;border:1px solid var(--line);border-radius:12px;padding:12px}.kv{display:grid;grid-template-columns:100px 1fr;padding:5px 0;border-bottom:1px solid #2b3445}.k{color:var(--muted)}
@media(max-width:850px){.grid,.preview{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<h1>Item Image Engine v0.1</h1>
<div class="sub">Lokaler, seed-basierter 64×64 Pixel-Art-Prototyp</div>
<div class="grid">
<div class="panel">
<label>Grundobjekt</label><select id="base"><option value="helmet">Helm</option><option value="hammer">Hammer</option><option value="sword">Schwert</option><option value="mug">Kaffeetasse</option><option value="toaster">Toaster</option></select>
<label>Material</label><select id="material"><option value="iron">Eisen</option><option value="brass">Messing</option><option value="bone">Knochen</option><option value="wood">Holz</option><option value="crystal">Kristall</option></select>
<div class="row"><div><label>Klasse A</label><select id="classA"><option value="none">Keine</option><option value="gunslinger">Gunslinger</option><option value="chrononaut">Chrononaut</option><option value="undertaker">Undertaker</option><option value="machinist">Machinist</option></select></div>
<div><label>Klasse B</label><select id="classB"><option value="none">Keine</option><option value="gunslinger">Gunslinger</option><option value="chrononaut">Chrononaut</option><option value="undertaker">Undertaker</option><option value="machinist">Machinist</option></select></div></div>
<label>Effekt</label><select id="effect"><option value="none">Keiner</option><option value="glow">Glow</option><option value="particles">Partikel</option><option value="echo">Echo</option></select>
<label>Seed</label><input id="seed" value="4821">
<div class="row"><button class="primary" id="gen">Generieren</button><button id="rand">Zufalls-Seed</button></div>
</div>
<div class="preview">
<div class="canvasbox"><canvas id="canvas" width="64" height="64"></canvas></div>
<div class="meta">
<div class="kv"><div class="k">Base</div><div id="mBase"></div></div>
<div class="kv"><div class="k">Material</div><div id="mMat"></div></div>
<div class="kv"><div class="k">Klasse A</div><div id="mA"></div></div>
<div class="kv"><div class="k">Klasse B</div><div id="mB"></div></div>
<div class="kv"><div class="k">Effekt</div><div id="mFx"></div></div>
<div class="kv"><div class="k">Seed</div><div id="mSeed"></div></div>
<p style="color:#9aa6b5">Pipeline: Base → Material → Seed-Variation → Klasse A → Klasse B → Effekt → Cleanup</p>
</div>
</div>
</div>
</div>
<script>
"use strict";
const c=document.getElementById("canvas"),ctx=c.getContext("2d");ctx.imageSmoothingEnabled=false;
function hash(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng32(a){return function(){let t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function px(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function line(x0,y0,x1,y1,col){x0|=0;y0|=0;x1|=0;y1|=0;let dx=Math.abs(x1-x0),sx=x0<x1?1:-1,dy=-Math.abs(y1-y0),sy=y0<y1?1:-1,e=dx+dy;while(true){px(x0,y0,1,1,col);if(x0===x1&&y0===y1)break;let e2=2*e;if(e2>=dy){e+=dy;x0+=sx}if(e2<=dx){e+=dx;y0+=sy}}}
function circle(cx,cy,r,col){for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++)if(x*x+y*y<=r*r)px(cx+x,cy+y,1,1,col)}
const MAT={
 iron:["#252b33","#555e69","#a6afb9","#dbe0e5"],brass:["#432d16","#8f6026","#d4a145","#f3d87c"],
 bone:["#443d31","#86795f","#c8b991","#f0dfb4"],wood:["#3d2517","#76472a","#b37747","#daa46a"],crystal:["#2c2342","#624a91","#9c7ee0","#d8c8ff"]
};
const CLS={none:["#7f8996","#46505d"],gunslinger:["#d49b46","#74461f"],chrononaut:["#9d78ff","#50387d"],undertaker:["#bbb3a3","#4f4942"],machinist:["#77a7cb","#355b77"]};
function baseHelmet(r,p){px(20,18,24,5,p[0]);px(16,23,32,19,p[1]);px(18,25,28,5,p[2]);px(21,29,22,14,p[0]);px(26,31,12,9,"#10141a");px(14,31,4,14,p[0]);px(46,31,4,14,p[0]);if(r()>.5){line(24,18,28,13,p[3]);line(40,18,36,13,p[3])}}
function baseHammer(r,p){px(11,18,32,12,p[0]);px(14,20,26,8,p[1]);px(18,22,18,4,p[2]);px(35,26,7,7,p[0]);px(35,31,5,21,p[1]);px(36,32,3,18,p[2])}
function baseSword(r,p){line(31,9,31,43,p[2]);line(32,9,32,43,p[3]);line(29,14,25,36,p[1]);line(34,14,38,36,p[1]);px(23,40,18,3,p[0]);px(29,43,6,12,p[1])}
function baseMug(r,p){px(18,21,24,25,p[1]);px(20,23,20,4,p[2]);px(20,28,18,16,p[0]);line(41,28,49,28,p[2]);line(49,28,49,39,p[2]);line(49,39,41,39,p[2]);line(41,39,41,28,p[2])}
function baseToaster(r,p){px(15,24,34,22,p[0]);px(17,26,30,18,p[1]);px(20,29,24,10,p[2]);px(21,26,22,3,"#11151b");px(19,46,5,3,p[0]);px(40,46,5,3,p[0])}
const BASE={helmet:baseHelmet,hammer:baseHammer,sword:baseSword,mug:baseMug,toaster:baseToaster};
function texture(r,p){for(let i=0;i<16;i++)px(17+Math.floor(r()*30),19+Math.floor(r()*30),1,1,p[0])}
function gunslinger(r,a,d){for(let i=0;i<3;i++){px(11+i*5,50,2,5,d);px(11+i*5,49,2,1,a)}circle(50,22,3,d);circle(50,22,1,a)}
function chrononaut(r,a,d){circle(11,16,5,d);circle(11,16,3,"#11151b");line(11,16,11,13,a);line(11,16,14,17,a)}
function undertaker(r,a,d){line(8,44,13,39,a);line(13,39,16,43,a);px(48,45,7,8,d);px(46,48,11,2,a)}
function machinist(r,a,d){for(const q of [[10,12],[53,18],[12,53],[51,50]]){circle(q[0],q[1],3,d);circle(q[0],q[1],1,a)}}
const DEC={none:()=>{},gunslinger,chrononaut,undertaker,machinist};
function fx(r,type,col){if(type==="particles"){for(let i=0;i<18;i++){let a=r()*Math.PI*2,rad=20+r()*10;px(32+Math.cos(a)*rad,32+Math.sin(a)*rad,r()>.75?2:1,1,col)}}else if(type==="echo"){ctx.globalAlpha=.18;line(10,12,54,12,col);line(8,14,52,14,col);ctx.globalAlpha=1}else if(type==="glow"){ctx.globalAlpha=.08;circle(32,32,20,col);ctx.globalAlpha=1}}
function draw(){
 const cfg={base:base.value,material:material.value,classA:classA.value,classB:classB.value,effect:effect.value,seed:String(seed.value||0)};
 const r=rng32(hash(JSON.stringify(cfg))),p=MAT[cfg.material],a=CLS[cfg.classA],b=CLS[cfg.classB];
 ctx.clearRect(0,0,64,64);
 for(let y=0;y<64;y+=8)for(let x=0;x<64;x+=8)px(x,y,8,8,((x+y)/8)%2?"#101722":"#0d1219");
 if(cfg.effect==="glow")fx(r,"glow",a[0]);
 BASE[cfg.base](r,p);texture(r,p);DEC[cfg.classA](r,a[0],a[1]);DEC[cfg.classB](r,b[0],b[1]);if(cfg.effect!=="glow"&&cfg.effect!=="none")fx(r,cfg.effect,a[0]);
 mBase.textContent=cfg.base;mMat.textContent=cfg.material;mA.textContent=cfg.classA;mB.textContent=cfg.classB;mFx.textContent=cfg.effect;mSeed.textContent=cfg.seed;
}
gen.addEventListener("click",draw);rand.addEventListener("click",()=>{seed.value=Math.floor(Math.random()*99999999);draw()});
["base","material","classA","classB","effect"].forEach(id=>document.getElementById(id).addEventListener("change",draw));draw();
</script>
</body>
</html>
